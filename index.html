<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLOUD IOS | PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Font Inter (Mirip SF Pro iPhone) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ios-blue: #007AFF;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
            margin: 0;
        }

        /* Real iPhone Glass Effect */
        .iphone-glass {
            background: rgba(28, 28, 30, 0.7);
            backdrop-filter: blur(30px) saturate(150%);
            -webkit-backdrop-filter: blur(30px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .iphone-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .iphone-card:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.1);
        }

        /* Animation Background */
        .orb {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: move 20s infinite alternate;
        }
        .orb-1 { background: rgba(0, 122, 255, 0.3); top: -10%; left: -10%; }
        .orb-2 { background: rgba(88, 86, 214, 0.2); bottom: -10%; right: -10%; animation-delay: -5s; }

        @keyframes move {
            from { transform: translate(0, 0); }
            to { transform: translate(100px, 100px); }
        }

        /* Spinner for Loading */
        .ios-spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--ios-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .no-select { user-select: none; -webkit-user-drag: none; }
    </style>
</head>
<body x-data="{ 
    page: 'home', 
    loading: false,
    selectedCheat: '',
    priceList: [
        {t: '1 Day', p: '10'}, {t: '3 Day', p: '20'}, {t: '7 Day', p: '40'},
        {t: '30 Day', p: '70'}, {t: '60 Day', p: '120'}, {t: '90 Day', p: '160'},
        {t: 'PERMANENT', p: '500'}
    ],
    triggerPayment() {
        this.page = 'loading';
        setTimeout(() => { this.page = 'error'; }, 10000);
    }
}">

    <!-- Animated Background -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Navigation -->
    <nav class="sticky top-0 z-50 p-5 flex justify-between items-center max-w-5xl mx-auto">
        <div class="flex items-center gap-2 cursor-pointer" @click="page = 'home'">
            <img src="https://i.ibb.co/4ntZnLgc/82-E1-A62-F-57-BB-4-D93-AAF9-2-F6087-E2-F860.png" class="w-10 h-10 no-select">
            <span class="font-bold text-xl tracking-tight">CLOUD <span class="text-blue-500">IOS</span></span>
        </div>
        <div class="flex gap-3">
            <button @click="page = 'login'" class="text-sm font-semibold px-5 py-2 rounded-full iphone-glass">Login</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-6 pt-12 pb-24">

        <!-- HOME PAGE -->
        <template x-if="page === 'home'">
            <div class="text-center">
                <h1 class="text-6xl md:text-7xl font-extrabold tracking-tight mb-6">
                    Elite Gaming <br><span class="text-blue-500">Security.</span>
                </h1>
                <p class="text-gray-400 text-lg font-medium mb-10">Antiban & Antiblacklist for Free Fire iOS.</p>
                <div class="flex flex-col md:flex-row justify-center gap-4 mb-20">
                    <button @click="page = 'register'" class="bg-white text-black px-10 py-4 rounded-full font-bold text-lg hover:opacity-90 transition">Register for Free</button>
                </div>

                <!-- Testimonials (Banyak) -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <template x-for="n in 8">
                        <div class="iphone-glass p-5 rounded-[22px] text-left">
                            <div class="flex gap-1 text-yellow-400 text-[10px] mb-2">★★★★★</div>
                            <p class="text-xs font-semibold leading-tight" x-text="[
                                'Padu bang! Rank naik laju.', 'Trusted gila admin dia.', 'Akaun safe, mantap.', 'No recoil terbaik.', 
                                'Sangat puas hati.', 'iOS 18 support!', 'Cheat paling smooth.', 'Auto headshot ngeri.'
                            ][n-1]"></p>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- LOGIN / REGISTER -->
        <template x-if="page === 'login' || page === 'register'">
            <div class="max-w-sm mx-auto pt-10">
                <div class="iphone-glass p-8 rounded-[35px]">
                    <h2 class="text-2xl font-bold mb-2 text-center" x-text="page === 'login' ? 'Login' : 'Create Account'"></h2>
                    <p class="text-center text-gray-500 text-sm mb-8 font-medium">No email required. Username only.</p>
                    <div class="space-y-4">
                        <input type="text" placeholder="Username" class="w-full bg-white/5 border-none p-4 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none font-semibold">
                        <input type="password" placeholder="Password" class="w-full bg-white/5 border-none p-4 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none font-semibold">
                        <button @click="page = 'dashboard'" class="w-full bg-blue-600 py-4 rounded-2xl font-bold text-lg mt-4 shadow-lg shadow-blue-500/30">Continue</button>
                    </div>
                </div>
            </div>
        </template>

        <!-- DASHBOARD (CHOOSE CHEAT) -->
        <template x-if="page === 'dashboard'">
            <div>
                <h2 class="text-3xl font-extrabold mb-8">Pilih Produk</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <template x-for="name in ['Magic Bullet', 'AimBody', 'AimChest', 'AimNeck', 'AimDrag']">
                        <div @click="selectedCheat = name; page = 'detail'" class="iphone-card p-8 cursor-pointer flex justify-between items-center">
                            <div>
                                <h3 class="text-2xl font-bold mb-1" x-text="name"></h3>
                                <p class="text-blue-500 text-xs font-bold uppercase tracking-widest">Antiban Active</p>
                            </div>
                            <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- DETAIL & PRICING -->
        <template x-if="page === 'detail'">
            <div class="max-w-4xl mx-auto">
                <div class="flex items-center gap-4 mb-8">
                    <button @click="page = 'dashboard'" class="iphone-glass p-3 rounded-full">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <h2 class="text-3xl font-extrabold" x-text="selectedCheat"></h2>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <template x-for="item in priceList">
                        <div @click="triggerPayment()" class="iphone-card p-6 flex flex-col items-center justify-center text-center">
                            <span class="text-[10px] font-bold text-gray-500 uppercase mb-2" x-text="item.t"></span>
                            <span class="text-2xl font-extrabold">RM<span x-text="item.p"></span></span>
                            <button class="mt-4 bg-blue-600/20 text-blue-400 text-[10px] font-extrabold px-4 py-2 rounded-full">BUY NOW</button>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- LOADING PAYMENT (10s) -->
        <template x-if="page === 'loading'">
            <div class="flex flex-col items-center justify-center py-24 text-center">
                <div class="ios-spinner mb-8"></div>
                <h2 class="text-3xl font-bold mb-2">Generating QR Code</h2>
                <p class="text-gray-500 font-medium">Please do not refresh this page...</p>
                <div class="mt-12 iphone-glass p-6 rounded-3xl flex items-center gap-4">
                    <img src="https://i.ibb.co/r2DfxYJ8/IMG-3430.png" class="w-12 h-12 no-select">
                    <div class="text-left">
                        <p class="text-xs text-gray-500 font-bold uppercase">Payment Provider</p>
                        <p class="font-bold">TNG eWallet</p>
                    </div>
                </div>
            </div>
        </template>

        <!-- ERROR PAGE -->
        <template x-if="page === 'error'">
            <div class="max-w-md mx-auto">
                <div class="iphone-glass p-10 rounded-[40px] text-center border-red-500/30">
                    <div class="w-20 h-20 bg-red-500/10 rounded-full flex items-center justify-center mx-auto mb-6">
                        <svg class="w-10 h-10 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    </div>
                    <h2 class="text-3xl font-extrabold mb-4 text-red-500">System Failed</h2>
                    <p class="text-gray-400 font-medium mb-8 leading-relaxed">
                        Maaf, penjana QR Code sedang mengalami masalah teknikal. Sila hubungi Admin secara manual.
                    </p>
                    <a href="https://t.me/pr0xyff" target="_blank" class="block w-full bg-blue-600 py-5 rounded-2xl font-bold text-lg mb-4">Contact Admin (Telegram)</a>
                    <button @click="page = 'dashboard'" class="text-gray-600 font-bold text-sm uppercase">Cancel</button>
                </div>
            </div>
        </template>

    </main>

    <footer class="text-center py-10 opacity-20 font-bold text-xs tracking-[0.4em] uppercase">
        Cloud iOS Security &copy; 2026
    </footer>

</body>
</html>

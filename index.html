<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLOUD IOS | PREMIUM SECURITY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #020617;
            color: white;
            overflow-x: hidden;
        }
        .real-glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .price-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .price-card:hover {
            transform: scale(1.05);
            background: rgba(0, 122, 255, 0.15);
            border-color: #007AFF;
        }
        .logo-img { pointer-events: none; user-select: none; }
        
        /* Loading Spinner */
        .spinner {
            width: 50px; height: 50px;
            border: 5px solid rgba(0, 122, 255, 0.1);
            border-top: 5px solid #007AFF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body x-data="{ 
    page: 'home', 
    selectedCheat: null,
    loading: false,
    priceList: [
        {time: '1 Day', rm: '10', popular: false}, 
        {time: '3 Day', rm: '20', popular: false}, 
        {time: '7 Day', rm: '40', popular: true},
        {time: '30 Day', rm: '70', popular: false}, 
        {time: '60 Day', rm: '120', popular: false}, 
        {time: '90 Day', rm: '160', popular: false},
        {time: 'PERMANENT', rm: '500', popular: false}
    ],
    startPayment() {
        this.page = 'loading';
        setTimeout(() => { this.page = 'error'; }, 10000);
    }
}">

    <!-- Nav -->
    <nav class="relative z-50 p-6 flex justify-between items-center max-w-7xl mx-auto">
        <div class="flex items-center gap-3 cursor-pointer" @click="page = 'home'">
            <img src="https://i.ibb.co/4ntZnLgc/82-E1-A62-F-57-BB-4-D93-AAF9-2-F6087-E2-F860.png" class="w-10 h-10 logo-img">
            <span class="font-extrabold text-xl tracking-tighter italic uppercase">Cloud<span class="text-blue-500">ios</span></span>
        </div>
        <button x-show="page === 'home'" @click="page = 'login'" class="real-glass px-6 py-2 rounded-full font-semibold text-sm">Login</button>
        <button x-show="page !== 'home'" @click="page = 'home'" class="text-gray-400 text-sm">Kembali Utama</button>
    </nav>

    <div class="relative z-10 max-w-7xl mx-auto px-6 pt-10 pb-20">

        <!-- HOME PAGE -->
        <template x-if="page === 'home'">
            <div class="text-center">
                <h1 class="text-5xl md:text-7xl font-black mb-6 uppercase tracking-tighter">iOS Game <span class="text-blue-500 italic">Security</span></h1>
                <p class="text-gray-400 mb-12">No.1 Antiban & Antiblacklist Technology for Free Fire iOS.</p>
                <button @click="page = 'login'" class="bg-blue-600 px-12 py-4 rounded-full font-bold text-lg hover:bg-blue-500 transition">MASUK SEKARANG</button>
                
                <!-- Fake Ratings (Banyak) -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-24">
                    <template x-for="n in 8">
                        <div class="real-glass p-4 rounded-2xl text-left">
                            <div class="flex text-yellow-500 text-xs mb-2">★★★★★</div>
                            <p class="text-xs text-gray-400 italic" x-text="['Mantap bang, key masuk laju!', 'Akaun utama safe 100%', 'Aimlock kemas habiss', 'iOS 17 pun support!', 'Terbaik admin!', 'Tak rugi beli permanent', 'Fungsi magic bullet paling win', 'Laju gila respon admin'][n-1]"></p>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- LOGIN -->
        <template x-if="page === 'login'">
            <div class="max-w-md mx-auto py-20">
                <div class="real-glass p-8 rounded-[30px]">
                    <h2 class="text-2xl font-bold mb-6 text-center italic uppercase">Dashboard Access</h2>
                    <input type="text" placeholder="Username" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl mb-4 focus:outline-none focus:border-blue-500">
                    <input type="password" placeholder="Password" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl mb-6 focus:outline-none focus:border-blue-500">
                    <button @click="page = 'dashboard'" class="w-full bg-blue-600 py-4 rounded-2xl font-bold uppercase tracking-widest">Login</button>
                </div>
            </div>
        </template>

        <!-- DASHBOARD (CHOOSE CHEAT) -->
        <template x-if="page === 'dashboard'">
            <div>
                <h2 class="text-3xl font-black mb-8 italic uppercase tracking-widest text-blue-500">Select Modul</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <template x-for="name in ['Magic Bullet', 'AimBody', 'AimChest', 'AimNeck', 'AimDrag']">
                        <div @click="selectedCheat = name; page = 'cheat-detail'" class="real-glass p-10 rounded-[40px] hover:bg-white/5 cursor-pointer border-b-4 border-blue-600 transition group">
                            <h3 class="text-2xl font-black mb-2" x-text="name"></h3>
                            <p class="text-xs text-gray-500 uppercase tracking-widest font-bold group-hover:text-blue-400">View Pricing &rarr;</p>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- CHEAT DETAIL (PRICING LIST) -->
        <template x-if="page === 'cheat-detail'">
            <div class="text-center">
                <h2 class="text-4xl font-black mb-2 italic uppercase" x-text="selectedCheat"></h2>
                <p class="text-blue-400 text-xs font-bold tracking-[0.3em] mb-12 uppercase">Sila Pilih Tempoh Masa</p>
                
                <div class="flex flex-wrap justify-center gap-4">
                    <template x-for="p in priceList">
                        <div @click="startPayment()" class="price-card w-full md:w-[200px] p-6 rounded-[30px] cursor-pointer relative overflow-hidden">
                            <template x-if="p.popular">
                                <div class="absolute top-0 right-0 bg-blue-600 text-[8px] font-bold px-3 py-1 rounded-bl-lg">HOT</div>
                            </template>
                            <p class="text-gray-400 text-[10px] uppercase font-black mb-2" x-text="p.time"></p>
                            <p class="text-2xl font-black">RM<span x-text="p.rm"></span></p>
                            <div class="mt-4 text-[10px] bg-white/10 py-2 rounded-full font-bold group-hover:bg-blue-600">BUY NOW</div>
                        </div>
                    </template>
                </div>
                <button @click="page = 'dashboard'" class="mt-12 text-gray-500 text-sm hover:text-white">&larr; Tukar Jenis Cheat</button>
            </div>
        </template>

        <!-- LOADING ANIMATION (10 SECONDS) -->
        <template x-if="page === 'loading'">
            <div class="min-h-[50vh] flex flex-col items-center justify-center py-20">
                <div class="spinner mb-8"></div>
                <h2 class="text-2xl font-bold animate-pulse">Generating QR Code...</h2>
                <p class="text-gray-500 mt-2">Sila tunggu sebentar, sistem sedang memproses maklumat pembayaran anda.</p>
                
                <div class="mt-10 real-glass p-6 rounded-2xl flex items-center gap-4">
                    <img src="https://i.ibb.co/r2DfxYJ8/IMG-3430.png" class="w-10 h-10">
                    <div class="text-left">
                        <p class="text-[10px] text-gray-500 font-bold uppercase">Payment Gateway</p>
                        <p class="font-bold text-sm">Touch 'n Go eWallet</p>
                    </div>
                </div>
            </div>
        </template>

        <!-- ERROR PAGE -->
        <template x-if="page === 'error'">
            <div class="max-w-md mx-auto py-10">
                <div class="real-glass p-10 rounded-[40px] border-red-500/50 border-t-8 text-center">
                    <div class="w-20 h-20 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-6">
                        <svg class="w-10 h-10 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    </div>
                    <h2 class="text-3xl font-black mb-4 uppercase text-red-500 italic">Error!</h2>
                    <p class="text-gray-400 mb-8 leading-relaxed">QR Generator gagal diproses. Sila hubungi Admin untuk pembelian manual melalui Telegram.</p>
                    
                    <a href="https://t.me/pr0xyff" target="_blank" class="block w-full bg-blue-600 py-5 rounded-2xl font-black text-lg mb-4 hover:scale-105 transition">CHAT ADMIN (TELEGRAM)</a>
                    <button @click="page = 'dashboard'" class="text-gray-600 text-xs uppercase font-bold tracking-widest">Back to Menu</button>
                </div>
            </div>
        </template>

    </div>

    <!-- Footer -->
    <footer class="text-center py-10 text-gray-700 text-[10px] uppercase tracking-[0.5em]">
        Cloud iOS &copy; 2026 Security Technology
    </footer>

</body>
</html>
